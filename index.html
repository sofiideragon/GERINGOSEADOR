<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Geringoseador</title>
    <style>
      :root {
        color-scheme: light;
        --ink: #20304a;
        --muted: #64748b;
        --accent: #e76f51;
        --accent-dark: #c9563a;
        --paper: #fffaf3;
        --card: rgba(255, 255, 255, 0.9);
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        color: var(--ink);
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background:
          radial-gradient(circle at 15% 10%, #ffd7ba 0, transparent 32%),
          radial-gradient(circle at 90% 90%, #cde9df 0, transparent 35%),
          var(--paper);
      }

      main {
        width: min(760px, 100%);
        padding: clamp(24px, 6vw, 56px);
        border: 1px solid rgba(32, 48, 74, 0.08);
        border-radius: 28px;
        background: var(--card);
        box-shadow: 0 24px 70px rgba(55, 44, 31, 0.14);
        backdrop-filter: blur(10px);
      }

      .eyebrow {
        margin: 0 0 10px;
        color: var(--accent-dark);
        font-size: 0.78rem;
        font-weight: 800;
        letter-spacing: 0.14em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2.2rem, 7vw, 4.6rem);
        line-height: 0.95;
        letter-spacing: -0.06em;
      }

      .intro {
        max-width: 560px;
        margin: 20px 0 32px;
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.6;
      }

      label {
        display: block;
        margin-bottom: 9px;
        font-weight: 750;
      }

      textarea {
        width: 100%;
        min-height: 150px;
        resize: vertical;
        padding: 16px;
        border: 2px solid #e7ded2;
        border-radius: 16px;
        color: var(--ink);
        background: #fff;
        font: inherit;
        line-height: 1.55;
        outline: none;
        transition: border-color 160ms ease, box-shadow 160ms ease;
      }

      textarea:focus {
        border-color: var(--accent);
        box-shadow: 0 0 0 4px rgba(231, 111, 81, 0.14);
      }

      .actions {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 16px 0 28px;
      }

      button {
        border: 0;
        border-radius: 999px;
        padding: 13px 24px;
        color: #fff;
        background: var(--accent);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
        box-shadow: 0 8px 18px rgba(231, 111, 81, 0.25);
        transition: transform 160ms ease, background 160ms ease;
      }

      button:hover { background: var(--accent-dark); transform: translateY(-1px); }
      button:active { transform: translateY(0); }

      .hint { color: var(--muted); font-size: 0.88rem; }

      .result {
        min-height: 150px;
        padding: 18px;
        border: 2px dashed #d8e0dc;
        border-radius: 16px;
        color: var(--ink);
        background: #f8fcfa;
        white-space: pre-wrap;
        overflow-wrap: anywhere;
        line-height: 1.55;
      }

      .result:empty::before {
        content: "Tu traducción aparecerá aquí…";
        color: #94a3b8;
      }

      @media (max-width: 560px) {
        .actions { align-items: flex-start; flex-direction: column; }
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Traductor divertido</p>
      <h1>Geringoseador</h1>
      <p class="intro">Escribí una frase, presioná el botón y convertí cada vocal al geringoso.</p>

      <label for="input-text">Texto de entrada</label>
      <textarea id="input-text" placeholder="Escribí aquí tu texto…" autofocus></textarea>

      <div class="actions">
        <button id="translate-button" type="button">Geringosear</button>
        <span class="hint">También podés usar Ctrl + Enter</span>
      </div>

      <label for="output-text">Resultado</label>
      <div id="output-text" class="result" role="status" aria-live="polite"></div>
    </main>

    <script>
      const input = document.querySelector('#input-text');
      const output = document.querySelector('#output-text');
      const button = document.querySelector('#translate-button');
      const vowels = new Set('aeiouáéíóúüAEIOUÁÉÍÓÚÜ');

      function geringosear(text) {
        let result = '';
        for (const character of text) {
          result += vowels.has(character) ? `${character}p${character}` : character;
        }
        return result;
      }

      function translate() {
        output.textContent = geringosear(input.value);
      }

      button.addEventListener('click', translate);
      input.addEventListener('keydown', (event) => {
        if (event.ctrlKey && event.key === 'Enter') translate();
      });
    </script>
  </body>
</html>
